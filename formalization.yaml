version: "v0.4"

project:
  name: "Norm Forms"
  description: "Finite-free universal-coordinate norms under arbitrary commutative base change; coordinate field norm forms with exact evaluation, degree, reindexing, and structural basis-change laws; anisotropic homogeneous forms with unbounded attained degrees, general zero-padded polynomial substitution laws over commutative semirings, and finite polynomial-system K-point zero-set compression over any non-algebraically-closed field."
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Beacon (responsible maintainer)"
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Finite-basis field norm and coordinate norm-form constructions"
    type: "folklore"
    relationship: "independently-proves"
    note: "Classical mathematics; this Lean development is original formal code, not a claim of novel mathematics or full coverage of a specific source."
  - title: "Finite-free universal coordinate norm under scalar extension"
    type: "folklore"
    relationship: "independently-proves"
    note: "Native left-multiplication norm in an arbitrary commutative base algebra, with universal polynomial equality; not a claim of selected-source coverage or third-party rights clearance."
  - title: "Finite polynomial-system zero-set compression over non-algebraically-closed fields"
    type: "folklore"
    relationship: "independently-proves"
    note: "Original Lean proofs of coefficient-field-point zero-set compression for finite families, including homogeneous inputs; no ideals, radicals, schemes, arbitrary-extension-point assertion or selected-source coverage claim."
  - title: "Cohomology of Number Fields"
    authors:
      - "Jürgen Neukirch"
      - "Alexander Schmidt"
      - "Kay Wingberg"
    type: "book"
    location: "Chapter VI"
    relationship: "background"
    note: "Mathematical background only; no complete source correspondence, chapter formalization, or source-coverage claim."

automation:
  methods:
    - method: "agent"
      framework: "Formal Frontier Hive Tasks with Codex CLI"
      tool_setup: "AI-assisted pooled worker contributions, repository-pinned Lean/mathlib builds, and independently arranged review."

