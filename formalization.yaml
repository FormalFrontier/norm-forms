version: "v0.4"

project:
  name: "Norm Forms"
  description: >-
    Coordinate norms over finite field extensions and universal finite-free
    norms under commutative base change; unbounded attained-degree anisotropic
    forms; polynomial padding and finite-system K-point zero-set compression;
    conditional homogeneous-system zeros and single-form zeros over algebraic,
    rational-function and finite-transcendence-degree extensions; finite-field
    common-zero theorems; and scalar sums annihilating positive tensor powers.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Beacon (responsible maintainer)"
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Finite-basis field norm and coordinate norm-form constructions"
    type: "folklore"
    relationship: "independently-proves"
    note: "Classical mathematics; the formal code does not claim novel mathematics or full coverage of a selected source."
  - title: "Finite-free universal coordinate norm under scalar extension"
    type: "folklore"
    relationship: "independently-proves"
    note: "Native norm under commutative base change and an actual universal polynomial identity, also for finite coefficient fields."
  - title: "Finite polynomial-system zero-set compression over non-algebraically-closed fields"
    type: "folklore"
    relationship: "independently-proves"
    note: "K-point zeros of finite families, including homogeneous inputs; no ideal, radical, scheme or all-extension-point equality. Homogeneous labels do not assert actual total degree."
  - title: "Equal-degree homogeneous-system nontrivial zeros from a uniform single-form bound"
    type: "folklore"
    relationship: "independently-proves"
    note: "A direct all-positive-degree single-form premise and strict s * d ^ r < n give a nonzero common zero for positive label d; empty, zero and repeated families are included."
  - title: "Homogeneous-form nontrivial zeros over algebraic field extensions"
    type: "folklore"
    relationship: "independently-proves"
    note: "The direct all-positive-degree base-field single-form premise, positive d and strict d ^ r < n yield a nonzero zero over an arbitrary algebraic extension, without finite, separable or perfect-extension hypotheses. Original project proof expression is reused."
  - title: "Homogeneous-form nontrivial zeros over rational-function fields"
    type: "folklore"
    relationship: "independently-proves"
    note: "The direct all-positive-degree base-field single-form premise and strict d ^ (r + 1) < m yield a nonzero zero of a positive-label-d form over RatFunc k, including zero forms and finite k; not simultaneous zeros. Original project proof expression is reused."
  - title: "Homogeneous-form nontrivial zeros over finite-transcendence-degree extensions"
    type: "folklore"
    relationship: "independently-proves"
    note: "For fields k → K of transcendence degree n, a uniform all-positive-degree base-field bound a ^ r < t, positive d and strict d ^ (r + n) < m give a nonzero K-point zero, including zero forms and infinite algebraic remainders; no finite-generation or separability premise. Original project proof expression is reused."
  - title: "Finite-field polynomial-system common zeros from Chevalley–Warning"
    type: "folklore"
    relationship: "independently-proves"
    note: "A second zero from a given common point follows when the sum of actual total degrees is strictly below the variable count, with no homogeneity requirement. Positive possibly varying homogeneous labels give nonzero common and single-form zeros, including zero and repeated forms and an empty family. A private finite-base-field extension client is not a new public theorem."
  - title: "Finite-field scalar sums annihilating positive tensor powers"
    type: "folklore"
    relationship: "independently-proves"
    note: "For positive s and arbitrary finite prescribed tensor families over finite K, strict s * card(selected tensors) * finrank K W < card(parameters) with finite-dimensional target W yields a nonzero coefficient vector: its scalar sum is surjective and its actual tensor map annihilates all prescribed tensors. No finite-dimensional source or tensor-map surjectivity is asserted; homogeneous label s need not equal actual total degree. Five ordinary-import clients are public."
  - title: "Cohomology of Number Fields"
    authors:
      - "Jürgen Neukirch"
      - "Alexander Schmidt"
      - "Kay Wingberg"
    type: "book"
    location: "Chapter VI"
    relationship: "background"
    note: "Background mathematics only; not reproduced expression, chapter formalization or a source-coverage claim."

automation:
  methods:
    - method: "agent"
      framework: "Codex CLI and Formal Frontier Hive Tasks"
      tool_setup: "AI-assisted formalization with repository-pinned Lean/mathlib and separate independent review."

review:
  status: "agent-reviewed"
  notes: >-
    The mathematical code and APIs in the existing 26-module published
    library received independent destination review and responsible-maintainer
    acceptance. Pinned both-root build and complete transitive standard-axiom
    evidence (including private declarations) apply to their unchanged code,
    dependencies and checker inputs, not to subsequent documentation edits.
    New public-reader wording and headers require their own affected review
    before acceptance; this metadata does not assert review or publication of
    any new cleanup contribution. Source correspondence, complete selected-source
    coverage and unrelated third-party rights are separate decisions.

acknowledgements: >-
  Original coordinate-norm definitions, zero/scalar laws and signed-characteristic-
  coefficient norm-polynomial proofs were contributed by Beacon and adapted
  into this library. Other Formal Frontier contributors developed structural
  basis-change and reindexing proofs, block iteration and anisotropic forms,
  universal norm identities, polynomial padding/compression, homogeneous-system
  and field-extension zeros, finite-field common zeros, positive-tensor-power
  scalar-sum annihilation, client tests and guides. Their mathematical authorship
  is distinct from subsequent assembly, independent review, documentation and
  release editing. Mathlib supplies field norms, polynomial infrastructure and
  Chevalley–Warning divisibility; the official multivariate-polynomials library
  supplies finite block iteration and coefficient-evaluation infrastructure.
  The mathematical book citation is background, not a claim to its authors'
  proof expression. Original project code is offered under Apache-2.0;
  upstream licenses and genuine third-party notices remain applicable.
