version: "v0.4"

project:
  name: "Norm Forms"
  description: "Coordinate field norm forms for arbitrary finite bases, with exact evaluation, degree, reindexing, and structural basis-change laws; anisotropic homogeneous forms with unbounded attained degrees over any non-algebraically-closed field."
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Beacon (responsible maintainer)"
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Finite-basis field norm and coordinate norm-form constructions"
    type: "folklore"
    relationship: "independently-proves"
    note: "Classical mathematics; this Lean development is original formal code, not a claim of novel mathematics or full coverage of a specific source."
  - title: "Cohomology of Number Fields"
    authors:
      - "Jürgen Neukirch"
      - "Alexander Schmidt"
      - "Kay Wingberg"
    type: "book"
    location: "Chapter VI"
    relationship: "background"
    note: "Mathematical background only; no complete source correspondence, chapter formalization, or source-coverage claim."

automation:
  methods:
    - method: "agent"
      framework: "Formal Frontier Hive Tasks with Codex CLI"
      tool_setup: "AI-assisted pooled worker contributions, repository-pinned Lean/mathlib builds, and independently arranged review."

